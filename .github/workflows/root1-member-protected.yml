name: VM7 Root1 three-principal protected consumer 261019

on:
  push:
    branches:
      - vm7-extends-member-sensitive-261019
    paths:
      - deploy-vm7-extends-member.sh

permissions:
  contents: read

jobs:
  protected-consumer:
    runs-on: ubuntu-latest
    environment: vm7-extends-member-env-261019
    env:
      VM7_EXTENDS_MEMBER_SECRET: ${{ secrets.VM7_EXTENDS_MEMBER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected deployment hook
        run: bash deploy-vm7-extends-member.sh
      - name: Upload controlled protected output
        uses: actions/upload-artifact@v4
        with:
          name: vm7-extends-member-protected-output-261019
          path: protected-output.bin
          if-no-files-found: error
